                { id: 'b2_4', title: 'Политика и общество', emoji: '🏛️', vocabulary: [ { en: 'government', ru: 'правительство', example: 'The government passed a new law.' }, { en: 'policy', ru: 'политика', example: 'The policy is controversial.' }, { en: 'election', ru: 'выборы', example: 'The election was fair.' }, { en: 'citizen', ru: 'гражданин', example: 'Every citizen has rights.' }, { en: 'democracy', ru: 'демократия', example: 'Democracy is important.' } ], grammar: 'Инверсия в условных предложениях: Should you need help, Had I known, Were I you.', examples: [ 'Should you need help, call me.', 'Had I known, I would have acted.', 'Were I you, I would apologize.' ], funFact: 'В Швейцарии граждане могут предлагать изменения в конституцию через референдумы.', tip: 'Инверсия — это формальный стиль. Начинается с Should, Had, Were без if.', tasks: [ { type: 'multiple_choice', question: 'Какое предложение с инверсией правильное?', options: ['Should you need help, call me', 'If you need help, call me', 'You should need help, call me', 'Need help, should you call me'], correct: 0 }, { type: 'fill_blank', question: '___ I known, I would have acted.', correct: 'had', options: ['Had', 'Have', 'If', 'Should'] }, { type: 'translation_ru', question: 'Переведи: «Every citizen has rights.»', correct: 'каждый гражданин имеет права', accept: ['у каждого гражданина есть права'] } ] },
                { id: 'b2_5', title: 'Наука и открытия', emoji: '🔬', vocabulary: [ { en: 'breakthrough', ru: 'прорыв', example: 'This is a scientific breakthrough.' }, { en: 'research', ru: 'исследование', example: 'The research is ongoing.' }, { en: 'experiment', ru: 'эксперимент', example: 'The experiment failed.' }, { en: 'theory', ru: 'теория', example: 'The theory was proven.' }, { en: 'discovery', ru: 'открытие', example: 'The discovery changed science.' } ], grammar: 'Reported Speech (продвинутый уровень): согласование времён, модальные глаголы в косвенной речи.', examples: [ 'The scientist said that the experiment had failed.', 'She told me that she would publish the results.', 'They announced that a breakthrough had been made.' ], funFact: 'Пенициллин открыли случайно, когда плесень попала в чашку Петри.', tip: 'В косвенной речи Past Simple → Past Perfect, will → would, can → could.', tasks: [ { type: 'multiple_choice', question: 'Переведи в косвенную речь: «The scientist said, "The experiment failed."»', options: ['The scientist said that the experiment had failed', 'The scientist said that the experiment failed', 'The scientist said that the experiment fails', 'The scientist said that the experiment has failed'], correct: 0 }, { type: 'fill_blank', question: 'She told me that she ___ publish the results.', correct: 'would', options: ['would', 'will', 'can', 'has'] }, { type: 'translation_ru', question: 'Переведи: «The discovery changed science.»', correct: 'открытие изменило науку', accept: ['открытие изменило науку'] } ] },
                { id: 'b2_6', title: 'Психология и эмоции', emoji: '🧠', vocabulary: [ { en: 'emotion', ru: 'эмоция', example: 'Emotions influence decisions.' }, { en: 'anxiety', ru: 'тревога', example: 'She suffers from anxiety.' }, { en: 'motivation', ru: 'мотивация', example: 'Motivation is key.' }, { en: 'behavior', ru: 'поведение', example: 'Human behavior is complex.' }, { en: 'resilience', ru: 'устойчивость', example: 'Resilience helps overcome stress.' } ], grammar: 'Mixed Conditionals: If + Past Perfect, would + V (смешение времён).', examples: [ 'If I had studied harder, I would be more confident now.', 'If she had taken the job, she would be rich now.', 'If he were more resilient, he would have recovered faster.' ], funFact: 'Мозг потребляет около 20% всей энергии тела, хотя составляет только 2% массы.', tip: 'Mixed Conditionals сочетают условие в прошлом и результат в настоящем.', tasks: [ { type: 'multiple_choice', question: 'Выбери смешанное условное:', options: ['If I had studied harder, I would be more confident now', 'If I studied harder, I would be more confident now', 'If I had studied harder, I would have been more confident now', 'If I would study harder, I would be more confident now'], correct: 0 }, { type: 'fill_blank', question: 'If she had taken the job, she ___ rich now.', correct: 'would be', options: ['would be', 'would have been', 'will be', 'is'] }, { type: 'translation_ru', question: 'Переведи: «Resilience helps overcome stress.»', correct: 'устойчивость помогает преодолеть стресс', accept: ['устойчивость помогает преодолевать стресс'] } ] },
                { id: 'b2_7', title: 'Бизнес и стартапы', emoji: '📈', vocabulary: [ { en: 'entrepreneur', ru: 'предприниматель', example: 'The entrepreneur launched a startup.' }, { en: 'revenue', ru: 'выручка', example: 'Revenue increased by 20%.' }, { en: 'investment', ru: 'инвестиции', example: 'The company needs investment.' }, { en: 'market', ru: 'рынок', example: 'The market is competitive.' }, { en: 'strategy', ru: 'стратегия', example: 'We need a new strategy.' } ], grammar: 'Модальные глаголы вероятности: must, might, could, can\'t для выражения уверенности.', examples: [ 'The project must be successful.', 'It might rain tomorrow.', 'She can\'t be the CEO; she\'s too young.' ], funFact: 'Apple начиналась в гараже Стива Джобса, а сейчас это самая дорогая компания мира.', tip: 'Must = уверенность (90%), might/could = возможность, can\'t = невозможно.', tasks: [ { type: 'multiple_choice', question: 'Как выразить уверенность: «Он, должно быть, директор»?', options: ['He must be the director', 'He might be the director', 'He could be the director', 'He can\'t be the director'], correct: 0 }, { type: 'fill_blank', question: 'It ___ rain tomorrow (возможно).', correct: 'might', options: ['might', 'must', 'can\'t', 'will'] }, { type: 'translation_ru', question: 'Переведи: «The market is competitive.»', correct: 'рынок конкурентоспособный', accept: ['рынок конкурентный'] } ] },
                { id: 'b2_8', title: 'Искусство и музеи', emoji: '🖼️', vocabulary: [ { en: 'masterpiece', ru: 'шедевр', example: 'The painting is a masterpiece.' }, { en: 'exhibition', ru: 'выставка', example: 'The exhibition opens tomorrow.' }, { en: 'curator', ru: 'куратор', example: 'The curator guided us.' }, { en: 'restoration', ru: 'реставрация', example: 'The restoration took years.' }, { en: 'canvas', ru: 'холст', example: 'The canvas is huge.' } ], grammar: 'Cleft sentences: What + clause + be + ... для выделения информации.', examples: [ 'What I love about art is the emotion.', 'It was the exhibition that impressed me.', 'What the curator said was inspiring.' ], funFact: 'Лувр — самый посещаемый музей мира. В 2023 году его посетили 8,9 млн человек.', tip: 'Cleft sentences делают речь выразительнее. Начинается с What или It is/was.', tasks: [ { type: 'multiple_choice', question: 'Какое предложение является cleft?', options: ['What I love is the emotion', 'I love the emotion', 'The emotion is loved', 'It is love the emotion'], correct: 0 }, { type: 'fill_blank', question: 'It ___ the exhibition that impressed me.', correct: 'was', options: ['was', 'is', 'were', 'be'] }, { type: 'translation_ru', question: 'Переведи: «The restoration took years.»', correct: 'реставрация заняла годы', accept: ['реставрация заняла много лет'] } ] }
            ]
        };

        // ========== СОСТОЯНИЕ ПРИЛОЖЕНИЯ ==========
        let currentUser = null;
        let currentScreen = 'login';
        let currentLevel = null;
        let currentLesson = null;
        let currentTaskIndex = 0;
        let score = 0;
        let testAnswers = [];
        let isTestMode = false;
        let testQuestions = [];
        let testLessonIds = [];

        // ========== УТИЛИТЫ ==========
        function safeLocalStorageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function safeLocalStorageSet(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { console.warn('localStorage недоступен:', e); return false; } }
        function saveData() { safeLocalStorageSet('puhlya_users', JSON.stringify(users)); }
        function loadData() { const data = safeLocalStorageGet('puhlya_users'); if (data) { try { users = JSON.parse(data); } catch (e) { console.warn('Не удалось прочитать данные:', e); users = []; } } }
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
        function getRandomPhrase(phrases) { return phrases[Math.floor(Math.random() * phrases.length)]; }
        function showScreen(screenId, param) { currentScreen = screenId; if (param && screenId === 'level') currentLevel = param; render(); }
        function showModal(content) { document.getElementById('modalContent').innerHTML = content; document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function confetti() { for (let i = 0; i < 20; i++) { const el = document.createElement('div'); el.className = 'confetti'; el.textContent = ['🎉', '🎊', '✨', '💖', '🌟'][Math.floor(Math.random() * 5)]; el.style.left = Math.random() * 100 + 'vw'; el.style.animationDuration = Math.random() * 2 + 2 + 's'; el.style.fontSize = Math.random() * 1.5 + 1 + 'em'; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); } }

        // ========== ПОЛЬЗОВАТЕЛИ ==========
        let users = [];
        function register(nick, password, name, age, avatar) { const user = { id: generateId(), nick, password, name, age, avatar, progress: { A1: { completedLessons: [], medals: [], testScores: [], errors: [], achievements: [], vocabulary: [] }, A2: { completedLessons: [], medals: [], testScores: [], errors: [], achievements: [], vocabulary: [] }, B1: { completedLessons: [], medals: [], testScores: [], errors: [], achievements: [], vocabulary: [] }, B2: { completedLessons: [], medals: [], testScores: [], errors: [], achievements: [], vocabulary: [] } }, createdAt: new Date().toISOString() }; users.push(user); saveData(); currentUser = user; return user; }
        function login(nick, password) { return users.find(u => u.nick === nick && u.password === password) || null; }
        function getUserById(id) { return users.find(u => u.id === id) || null; }
        function updateUser(user) { const index = users.findIndex(u => u.id === user.id); if (index !== -1) { users[index] = user; saveData(); currentUser = user; } }

        // ========== ЛОГИКА ПРОГРЕССА ==========
        function getLevelProgress(level) { if (!currentUser) return 0; const totalLessons = lessonsData[level].length; const completed = currentUser.progress[level].completedLessons.length; return totalLessons > 0 ? Math.round((completed / totalLessons) * 100) : 0; }
        function addVocabularyToUser(level, lesson) { lesson.vocabulary.forEach(v => { if (!currentUser.progress[level].vocabulary.find(w => w.en === v.en)) currentUser.progress[level].vocabulary.push(v); }); }
        function completeLesson(level, lessonId) { if (!currentUser.progress[level].completedLessons.includes(lessonId)) { currentUser.progress[level].completedLessons.push(lessonId); const lesson = lessonsData[level].find(l => l.id === lessonId); if (lesson) { currentUser.progress[level].medals.push({ lessonId, title: lesson.title, emoji: lesson.emoji, date: new Date().toISOString() }); currentUser.progress[level].achievements.push({ type: 'lesson', text: `Пройден урок «${lesson.title}»`, date: new Date().toISOString() }); addVocabularyToUser(level, lesson); } updateUser(currentUser); } }
        function addError(level, question, correctAnswer, userAnswer, lessonId) { currentUser.progress[level].errors.push({ question, correctAnswer, userAnswer, lessonId, date: new Date().toISOString() }); updateUser(currentUser); }
        function addTestScore(level, score, maxScore, lessonIds) { const grade = getGrade(score, maxScore); currentUser.progress[level].testScores.push({ score, maxScore, grade, lessonIds, date: new Date().toISOString() }); currentUser.progress[level].achievements.push({ type: 'test', text: `Контрольная работа: оценка ${grade}`, date: new Date().toISOString() }); updateUser(currentUser); }
        function getGrade(score, maxScore) { const percent = score / maxScore; if (percent >= 0.9) return 5; if (percent >= 0.75) return 4; if (percent >= 0.6) return 3; return 2; }
        function getTotalMedals() { if (!currentUser) return 0; return Object.values(currentUser.progress).reduce((acc, p) => acc + p.medals.length, 0); }

        // ========== ГЕНЕРАЦИЯ ЗАДАНИЙ ДЛЯ КОНТРОЛЬНОЙ ==========
        function generateTest(level, lessonIds) { let allTasks = []; lessonIds.forEach(lid => { const lesson = lessonsData[level].find(l => l.id === lid); if (lesson) { lesson.tasks.forEach(t => { allTasks.push({ ...t, lessonId: lid, lessonTitle: lesson.title }); }); } }); allTasks = shuffleArray(allTasks); return allTasks.slice(0, Math.min(10, allTasks.length)); }
        function getLessonIdsForBlock(level, blockIndex) { const lessons = lessonsData[level]; const start = blockIndex * 3; return lessons.slice(start, start + 3).map(l => l.id); }

        // ========== ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ДЛЯ ПРОВЕРКИ ОТВЕТОВ ==========
        function isCorrectAnswer(task, userValue) {
            if (typeof task.correct === 'number') {
                return userValue === task.correct;
            } else {
                return userValue.toLowerCase() === task.correct.toLowerCase();
            }
        }
        function getCorrectAnswerText(task) {
            return typeof task.correct === 'number' ? task.options[task.correct] : task.correct;
        }

        // ========== РЕНДЕРИНГ ==========
        function render() { const app = document.getElementById('app'); switch (currentScreen) { case 'login': renderLogin(app); break; case 'register': renderRegister(app); break; case 'welcome': renderWelcome(app); break; case 'main': renderMain(app); break; case 'level': renderLevel(app); break; case 'lesson': renderLesson(app); break; case 'test': renderTest(app); break; case 'profile': renderProfile(app); break; case 'vocabulary': renderVocabulary(app); break; default: renderLogin(app); } }

        function renderLogin(app) { app.innerHTML = `<h1>🐱 Пухля English</h1><p class="subtitle">Учи английский с самым милым котиком!</p><div class="grid" style="max-width: 400px; margin: 0 auto;"><div class="card"><h3>Вход</h3><input type="text" id="loginNick" placeholder="Ник"><input type="password" id="loginPassword" placeholder="Пароль"><button class="btn" onclick="handleLogin()">Войти</button><p style="margin-top: 15px;">Нет аккаунта? <a href="#" onclick="showScreen('register'); return false;">Зарегистрироваться</a></p></div></div>`; }
        function renderRegister(app) { app.innerHTML = `<h1>🐱 Регистрация</h1><p class="subtitle">Создай свой профиль и начни учиться!</p><div class="grid" style="max-width: 500px; margin: 0 auto;"><div class="card"><h3>Придумай ник и пароль</h3><input type="text" id="regNick" placeholder="Ник"><input type="password" id="regPassword" placeholder="Пароль"><input type="text" id="regName" placeholder="Твоё имя"><input type="number" id="regAge" placeholder="Возраст" min="1" max="120"><h3 style="margin-top: 15px;">Выбери аватарку (друг Пухли)</h3><div class="avatar-select">${AVATARS.map((a, i) => `<span class="avatar-option" data-index="${i}" onclick="selectAvatar(${i})" title="${AVATAR_NAMES[i]}">${a}</span>`).join('')}</div><button class="btn btn-purple" style="margin-top: 20px;" onclick="handleRegister()">Создать аккаунт</button></div></div>`; window.selectedAvatar = 0; }
        function selectAvatar(index) { window.selectedAvatar = index; document.querySelectorAll('.avatar-option').forEach((el, i) => el.classList.toggle('selected', i === index)); }
        function renderWelcome(app) { app.innerHTML = `<div class="character-box fade-in"><div class="character-face">🐱</div><div class="speech-bubble"><p>Приятно познакомиться, ${currentUser.name}! А я Пухля :)<br>Do you speak English?</p><p style="margin-top: 10px; color: #888;">Тебе ${currentUser.age} лет. Отличный возраст для изучения английского!</p></div></div><div style="text-align: center;"><button class="btn" onclick="showScreen('main')">Начать обучение →</button></div>`; }
        function renderMain(app) { const totalMedals = getTotalMedals(); const levels = ['A1', 'A2', 'B1', 'B2']; const levelEmojis = { A1: '🌱', A2: '🌿', B1: '🌳', B2: '🌲' }; const levelNames = { A1: 'Beginner', A2: 'Elementary', B1: 'Intermediate', B2: 'Upper-Intermediate' }; app.innerHTML = `<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;"><div><h1>Привет, ${currentUser.name}! ${currentUser.avatar}</h1><p class="subtitle">Твой прогресс: ${totalMedals} медалей</p></div><div><button class="btn btn-secondary" onclick="showScreen('profile')">👤 Профиль</button><button class="btn btn-purple" onclick="showScreen('vocabulary')">📖 Словарик</button><button class="btn" onclick="logout()">Выйти</button></div></div><div class="grid">${levels.map(level => { const progress = getLevelProgress(level); const completed = currentUser.progress[level].completedLessons.length; const total = lessonsData[level].length; return `<div class="card" onclick="showScreen('level', '${level}')"><h3>${levelEmojis[level]} Уровень ${level}</h3><p>${levelNames[level]}</p><div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div><p>${completed} / ${total} уроков · ${progress}%</p></div>`; }).join('')}</div><div class="character-box" style="margin-top: 30px;"><div class="character-face">🐱</div><div class="speech-bubble"><p>${getRandomPhrase(thinkingPhrases)}</p></div></div>`; }
        function renderLevel(app) { const level = currentLevel; const lessons = lessonsData[level]; const completed = currentUser.progress[level].completedLessons; const medals = currentUser.progress[level].medals; const testScores = currentUser.progress[level].testScores; app.innerHTML = `<div style="display: flex; justify-content: space-between; align-items: center;"><h1>Уровень ${level}</h1><button class="btn" onclick="showScreen('main')">← Назад</button></div><div class="progress-bar" style="margin: 15px 0;"><div class="progress-fill" style="width: ${getLevelProgress(level)}%"></div></div><p>Пройдено: ${completed.length} из ${lessons.length} блоков</p><div class="grid">${lessons.map((lesson, i) => { const isDone = completed.includes(lesson.id); const medal = medals.find(m => m.lessonId === lesson.id); const blockNum = Math.floor(i / 3) + 1; return `<div class="card" onclick="openLesson('${level}', '${lesson.id}')"><h3>${lesson.emoji} ${lesson.title} ${isDone ? '✅' : ''}</h3><p>Блок ${blockNum}</p>${medal ? `<span class="medal">${medal.emoji}</span>` : ''}</div>`; }).join('')}</div>${lessons.length > 0 && lessons.length % 3 === 0 ? `<h3 style="margin-top: 30px;">Контрольные работы</h3><p>Пройди контрольную после каждых 3 блоков, чтобы получить оценку от 2 до 5.</p><div class="grid">${Array.from({ length: Math.ceil(lessons.length / 3) }, (_, i) => { const blockLessons = getLessonIdsForBlock(level, i); const allDone = blockLessons.every(id => completed.includes(id)); const score = testScores.filter(t => t.lessonIds.some(id => blockLessons.includes(id))).slice(-1)[0]; return `<div class="card"><h3>Контрольная ${i + 1}</h3><p>По блокам ${i * 3 + 1}-${i * 3 + 3}</p>${score ? `<p>Оценка: <span class="score-${score.grade}">${score.grade}</span> (${score.score}/${score.maxScore})</p>` : ''}${allDone ? `<button class="btn btn-purple" onclick="startTest('${level}', ${i})">Пройти контрольную</button>` : '<p style="color:#888;">Сначала пройди все 3 блока</p>'}</div>`; }).join('')}</div>` : ''}<h3 style="margin-top: 30px;">Проверочная работа (по желанию)</h3><p>Пройди тест по всем пройденным блокам этого уровня.</p><button class="btn btn-secondary" onclick="startOptionalTest('${level}')">Начать проверочную</button>`; }

        function renderLesson(app) { const level = currentLevel; const lesson = lessonsData[level].find(l => l.id === currentLesson); if (!lesson) { showScreen('level'); return; } const isDone = currentUser.progress[level].completedLessons.includes(lesson.id); let contentHTML = `<div style="display: flex; justify-content: space-between; align-items: center;"><h1>${lesson.emoji} ${lesson.title}</h1><button class="btn" onclick="showScreen('level')">← Назад</button></div><div class="lesson-content"><h4>📚 Новая лексика</h4><table class="vocab-table"><tr><th>Английский</th><th>Русский</th><th>Пример</th></tr>${lesson.vocabulary.map(v => `<tr><td>${v.en}</td><td>${v.ru}</td><td>${v.example}</td></tr>`).join('')}</table><h4>📐 Грамматика</h4><p>${lesson.grammar}</p><h4>💬 Примеры</h4><ul>${lesson.examples.map(e => `<li>${e}</li>`).join('')}</ul><h4>🤔 Интересный факт</h4><p>${lesson.funFact}</p><h4>💡 Совет</h4><p>${lesson.tip}</p></div>${isDone ? '<p style="text-align:center; color:green;">✅ Урок пройден! Можешь повторить или идти дальше.</p>' : ''}`; if (!isTestMode) { contentHTML += `<div style="text-align: center;"><button class="btn" onclick="startLessonTasks('${level}', '${lesson.id}')">${isDone ? 'Повторить задания' : 'Начать задания'}</button></div>`; } else { const task = lesson.tasks[currentTaskIndex]; contentHTML += renderTask(task, level, lesson.id); } app.innerHTML = contentHTML; }

        function renderTask(task, level, lessonId) { let taskHTML = `<div class="task-container"><h3>Задание ${currentTaskIndex + 1} из ${lessonsData[level].find(l => l.id === lessonId).tasks.length}</h3><p><strong>${task.question}</strong></p>`; if (task.type === 'flashcards') { taskHTML += `<div style="text-align:center; padding: 20px;">${task.options.map(opt => `<button class="btn" onclick="handleFlashcard('${level}', '${lessonId}')">${opt}</button>`).join('')}</div>`; } else if (task.type === 'multiple_choice' || task.type === 'fill_blank') { taskHTML += `<div class="task-options">${task.options.map((opt, i) => `<div class="task-option" onclick="handleMultipleChoice(${i}, this, '${level}', '${lessonId}')">${opt}</div>`).join('')}</div>`; } else if (task.type === 'translation_ru' || task.type === 'translation_en' || task.type === 'dialogue') { taskHTML += `<input type="text" id="translationInput" placeholder="Введи ответ..."><button class="btn" onclick="handleTranslation('${level}', '${lessonId}')">Проверить</button>`; } else if (task.type === 'word_bank') { taskHTML += `<div class="word-bank" id="wordBank">${shuffleArray(task.words).map(w => `<span onclick="addWordToSentence(this, '${w}')">${w}</span>`).join('')}</div><div class="sentence-builder" id="sentenceBuilder"></div><button class="btn" onclick="checkWordBank('${level}', '${lessonId}')">Проверить</button><button class="btn btn-secondary" onclick="clearSentence()">Очистить</button>`; } taskHTML += `</div>`; return taskHTML; }

        function renderTest(app) { const level = currentLevel; const questions = testQuestions; const currentQ = testAnswers.length; const totalQ = questions.length; if (currentQ >= totalQ) { finishTest(level); return; } const q = questions[currentQ]; app.innerHTML = `<div style="display: flex; justify-content: space-between; align-items: center;"><h1>📝 Контрольная работа</h1><span>Вопрос ${currentQ + 1} / ${totalQ}</span></div><div class="progress-bar"><div class="progress-fill" style="width: ${(currentQ / totalQ) * 100}%"></div></div><div class="task-container"><h3>${q.question}</h3>${renderTestTask(q, currentQ)}</div><div class="character-box"><div class="character-face">🐱</div><div class="speech-bubble"><p>${getRandomPhrase(thinkingPhrases)}</p></div></div>`; window.currentTestQuestion = q; window.currentTestIndex = currentQ; }

        function renderTestTask(q, index) { if (q.type === 'multiple_choice' || q.type === 'fill_blank') { return `<div class="task-options">${q.options.map((opt, i) => `<div class="task-option" onclick="handleTestChoice(${i}, this, ${index})">${opt}</div>`).join('')}</div>`; } else if (q.type === 'translation_ru' || q.type === 'translation_en' || q.type === 'dialogue') { return `<input type="text" id="testTranslationInput" placeholder="Введи ответ..."><button class="btn" onclick="handleTestTranslation(${index})">Проверить</button>`; } else if (q.type === 'word_bank') { return `<div class="word-bank" id="testWordBank">${shuffleArray(q.words).map(w => `<span onclick="addTestWordToSentence(this, '${w}')">${w}</span>`).join('')}</div><div class="sentence-builder" id="testSentenceBuilder"></div><button class="btn" onclick="checkTestWordBank(${index})">Проверить</button><button class="btn btn-secondary" onclick="clearTestSentence()">Очистить</button>`; } else if (q.type === 'flashcards') { return `<div style="text-align:center; padding: 20px;"><button class="btn" onclick="handleTestFlashcard(${index})">Запомнил(а)</button></div>`; } return ''; }

        function renderProfile(app) { const totalMedals = getTotalMedals(); const totalErrors = Object.values(currentUser.progress).reduce((acc, p) => acc + p.errors.length, 0); const totalTests = Object.values(currentUser.progress).reduce((acc, p) => acc + p.testScores.length, 0); const achievements = Object.values(currentUser.progress).flatMap(p => p.achievements); const errors = Object.values(currentUser.progress).flatMap(p => p.errors.map(e => ({...e, level: Object.keys(currentUser.progress).find(k => currentUser.progress[k].errors.includes(e))}))); let medalsHTML = Object.entries(currentUser.progress).map(([level, p]) => p.medals.length ? p.medals.map(m => `<span class="medal" title="${level}: ${m.title}">${m.emoji}</span>`).join('') : '').join(''); app.innerHTML = `<div style="display: flex; justify-content: space-between; align-items: center;"><h1>👤 Профиль</h1><button class="btn" onclick="showScreen('main')">← Назад</button></div><div class="card" style="margin-top: 20px;"><div style="display: flex; align-items: center; gap: 20px;"><div style="font-size: 4em;">${currentUser.avatar}</div><div><h2>${currentUser.name}</h2><p>Ник: ${currentUser.nick} · Возраст: ${currentUser.age}</p><p>Медалей: ${totalMedals} · Пройдено тестов: ${totalTests} · Ошибок: ${totalErrors}</p></div></div></div><div class="grid" style="margin-top: 20px;">${['A1', 'A2', 'B1', 'B2'].map(level => `<div class="card"><h3>Уровень ${level}</h3><div class="progress-bar"><div class="progress-fill" style="width: ${getLevelProgress(level)}%"></div></div><p>${getLevelProgress(level)}%</p></div>`).join('')}</div><div class="tab-nav"><button class="active" onclick="switchProfileTab(this, 'achievements')">🏆 Достижения</button><button onclick="switchProfileTab(this, 'errors')">❌ Ошибки</button><button onclick="switchProfileTab(this, 'tips')">💡 Советы</button></div><div id="profileTabContent"><h3>🏆 Твои достижения</h3><div class="achievement-log">${achievements.length > 0 ? achievements.map(a => `<p>${a.text} (${new Date(a.date).toLocaleDateString()})</p>`).join('') : '<p>Пока нет достижений. Начни учиться!</p>'}</div>${medalsHTML ? `<div style="margin-top: 15px;">${medalsHTML}</div>` : ''}</div>`; window.profileTab = 'achievements'; }

        function switchProfileTab(btn, tab) { document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); window.profileTab = tab; const content = document.getElementById('profileTabContent'); const achievements = Object.values(currentUser.progress).flatMap(p => p.achievements); const errors = Object.values(currentUser.progress).flatMap(p => p.errors.map(e => ({...e, level: Object.keys(currentUser.progress).find(k => currentUser.progress[k].errors.includes(e))}))); if (tab === 'achievements') { content.innerHTML = `<h3>🏆 Твои достижения</h3><div class="achievement-log">${achievements.length > 0 ? achievements.map(a => `<p>${a.text} (${new Date(a.date).toLocaleDateString()})</p>`).join('') : '<p>Пока нет достижений.</p>'}</div>`; } else if (tab === 'errors') { content.innerHTML = `<h3>❌ Анализ ошибок</h3>${errors.length > 0 ? errors.map(e => `<div class="error-log"><p><strong>Вопрос:</strong> ${e.question}</p><p><strong>Твой ответ:</strong> ${e.userAnswer}</p><p><strong>Правильный ответ:</strong> ${e.correctAnswer}</p><p><small>${new Date(e.date).toLocaleString()}</small></p></div>`).join('') : '<p>Ошибок пока нет. Ты супер!</p>'}`; } else if (tab === 'tips') { content.innerHTML = `<h3>💡 Советы и факты</h3><div class="lesson-content">${tips.map(t => `<p>${t}</p>`).join('<hr>')}</div>`; } }

        function renderVocabulary(app) { const allVocab = Object.entries(currentUser.progress).flatMap(([level, p]) => p.vocabulary.map(v => ({...v, level}))); app.innerHTML = `<div style="display: flex; justify-content: space-between; align-items: center;"><h1>📖 Словарик</h1><button class="btn" onclick="showScreen('main')">← Назад</button></div><p>Изученные слова: ${allVocab.length}</p><div class="lesson-content">${allVocab.length > 0 ? `<table class="vocab-table"><tr><th>Слово</th><th>Перевод</th><th>Пример</th><th>Уровень</th></tr>${allVocab.map(v => `<tr><td>${v.en}</td><td>${v.ru}</td><td>${v.example}</td><td>${v.level}</td></tr>`).join('')}</table>` : '<p>Словарик пуст. Проходи уроки, чтобы добавлять слова!</p>'}</div>`; }

        // ========== ОБРАБОТЧИКИ СОБЫТИЙ ==========
        function handleLogin() { const nick = document.getElementById('loginNick').value.trim(); const password = document.getElementById('loginPassword').value; const user = login(nick, password); if (user) { currentUser = user; showScreen('main'); } else { alert('Неверный ник или пароль!'); } }
        function handleRegister() { const nick = document.getElementById('regNick').value.trim(); const password = document.getElementById('regPassword').value; const name = document.getElementById('regName').value.trim(); const ageInput = document.getElementById('regAge').value; const age = parseInt(ageInput, 10); if (!nick || !password || !name || !ageInput) { alert('Заполни все поля!'); return; } if (isNaN(age) || age < 1 || age > 120) { alert('Возраст должен быть числом от 1 до 120!'); return; } if (users.find(u => u.nick === nick)) { alert('Такой ник уже занят!'); return; } const avatarIndex = window.selectedAvatar || 0; const user = register(nick, password, name, age, AVATARS[avatarIndex]); showScreen('welcome'); }
        function logout() { currentUser = null; showScreen('login'); }
        function openLesson(level, lessonId) { currentLevel = level; currentLesson = lessonId; currentTaskIndex = 0; isTestMode = false; showScreen('lesson'); }
        function startLessonTasks(level, lessonId) { currentLevel = level; currentLesson = lessonId; currentTaskIndex = 0; isTestMode = true; showScreen('lesson'); }

        function handleFlashcard(level, lessonId) { nextTask(level, lessonId, true); }

        function handleMultipleChoice(index, element, level, lessonId) {
            const task = lessonsData[level].find(l => l.id === lessonId).tasks[currentTaskIndex];
            const isCorrect = isCorrectAnswer(task, index);
            element.classList.add(isCorrect ? 'correct' : 'wrong');
            if (!isCorrect) {
                document.querySelectorAll('.task-option').forEach((el, i) => { if (i === getCorrectAnswerText(task)) el.classList.add('correct'); });
                addError(level, task.question, getCorrectAnswerText(task), task.options[index], lessonId);
                showReaction(false, level);
            } else {
                showReaction(true, level);
            }
            setTimeout(() => nextTask(level, lessonId, isCorrect), 1500);
        }

        function handleTranslation(level, lessonId) {
            const input = document.getElementById('translationInput');
            const answer = input.value.trim().toLowerCase();
            const task = lessonsData[level].find(l => l.id === lessonId).tasks[currentTaskIndex];
            const correctAnswers = [task.correct.toLowerCase(), ...(task.accept || []).map(a => a.toLowerCase())];
            const isCorrect = correctAnswers.includes(answer);
            if (isCorrect) {
                showReaction(true, level);
                setTimeout(() => nextTask(level, lessonId, true), 1500);
            } else {
                addError(level, task.question, task.correct, answer, lessonId);
                showReaction(false, level);
                input.style.borderColor = '#ff6b6b';
                setTimeout(() => { input.style.borderColor = ''; input.value = ''; }, 1500);
            }
        }

        function addWordToSentence(element, word) { const builder = document.getElementById('sentenceBuilder'); const span = document.createElement('span'); span.textContent = word; span.style.cursor = 'pointer'; span.onclick = function() { this.remove(); }; builder.appendChild(span); element.style.opacity = '0.3'; element.style.pointerEvents = 'none'; window.sentenceWords = window.sentenceWords || []; window.sentenceWords.push(word); }
        function clearSentence() { const builder = document.getElementById('sentenceBuilder'); builder.innerHTML = ''; document.querySelectorAll('.word-bank span').forEach(el => { el.style.opacity = '1'; el.style.pointerEvents = 'auto'; }); window.sentenceWords = []; }
        function checkWordBank(level, lessonId) { const task = lessonsData[level].find(l => l.id === lessonId).tasks[currentTaskIndex]; const builder = document.getElementById('sentenceBuilder'); const words = Array.from(builder.querySelectorAll('span')).map(s => s.textContent); const sentence = words.join(' ').toLowerCase(); const isCorrect = sentence === task.correctSentence.toLowerCase(); if (isCorrect) { showReaction(true, level); setTimeout(() => nextTask(level, lessonId, true), 1500); } else { addError(level, task.question, task.correctSentence, sentence, lessonId); showReaction(false, level); clearSentence(); } }

        function nextTask(level, lessonId, correct) {
            const lesson = lessonsData[level].find(l => l.id === lessonId);
            if (correct && currentTaskIndex < lesson.tasks.length - 1) {
                currentTaskIndex++;
                renderLesson(document.getElementById('app'));
            } else if (currentTaskIndex >= lesson.tasks.length - 1) {
                if (isTestMode) {
                    completeLesson(level, lessonId);
                    isTestMode = false;
                    showModal(`<h2>🎉 Урок пройден!</h2><p>Ты получил медаль: ${lesson.emoji} ${lesson.title}</p><button class="btn" onclick="closeModal(); showScreen('level');">Отлично!</button>`);
                    confetti();
                } else {
                    showModal(`<h2>📚 Урок просмотрен</h2><p>Теперь попробуй выполнить задания!</p><button class="btn" onclick="closeModal(); startLessonTasks('${level}', '${lessonId}');">Начать задания</button>`);
                }
            } else {
                renderLesson(document.getElementById('app'));
            }
        }

        function showReaction(isCorrect, level) {
            let face = isCorrect ? '😻' : '😾';
            let phrase = isCorrect ? getRandomPhrase(positivePhrases) : getRandomPhrase(negativePhrases);
            const r = Math.random();
            let extraChar = '';
            if (r < 0.2) extraChar = `<p style="margin-top: 10px;">${getRandomPhrase(maryPhrases)}</p>`;
            else if (r < 0.4) extraChar = `<p style="margin-top: 10px;">${getRandomPhrase(jackPhrases)}</p>`;
            showModal(`<div style="font-size: 4em;">${face}</div><p style="font-size: 1.3em; margin: 15px 0;">${phrase}</p>${extraChar}<button class="btn" onclick="closeModal()">Продолжить</button>`);
        }

        function startTest(level, blockIndex) { currentLevel = level; const lessonIds = getLessonIdsForBlock(level, blockIndex); testQuestions = generateTest(level, lessonIds); testAnswers = []; score = 0; isTestMode = true; testLessonIds = lessonIds; showScreen('test'); }
        function startOptionalTest(level) { currentLevel = level; const completed = currentUser.progress[level].completedLessons; if (completed.length === 0) { alert('Сначала пройди хотя бы один урок!'); return; } testQuestions = generateTest(level, completed); testAnswers = []; score = 0; isTestMode = true; testLessonIds = completed; showScreen('test'); }

        function handleTestChoice(index, element, qIndex) {
            const q = testQuestions[qIndex];
            const isCorrect = isCorrectAnswer(q, index);
            element.classList.add(isCorrect ? 'correct' : 'wrong');
            if (!isCorrect) {
                document.querySelectorAll('.task-option').forEach((el, i) => { if (i === getCorrectAnswerText(q)) el.classList.add('correct'); });
                addError(currentLevel, q.question, getCorrectAnswerText(q), q.options[index], q.lessonId);
            }
            testAnswers.push({ question: q, userAnswer: q.options[index], correct: isCorrect });
            if (isCorrect) score++;
            setTimeout(() => render(), 1000);
        }

        function handleTestTranslation(qIndex) { const input = document.getElementById('testTranslationInput'); const answer = input.value.trim().toLowerCase(); const q = testQuestions[qIndex]; const correctAnswers = [q.correct.toLowerCase(), ...(q.accept || []).map(a => a.toLowerCase())]; const isCorrect = correctAnswers.includes(answer); if (!isCorrect) addError(currentLevel, q.question, q.correct, answer, q.lessonId); testAnswers.push({ question: q, userAnswer: answer, correct: isCorrect }); if (isCorrect) score++; render(); }
        function addTestWordToSentence(element, word) { const builder = document.getElementById('testSentenceBuilder'); const span = document.createElement('span'); span.textContent = word; span.style.cursor = 'pointer'; span.onclick = function() { this.remove(); }; builder.appendChild(span); element.style.opacity = '0.3'; element.style.pointerEvents = 'none'; window.testSentenceWords = window.testSentenceWords || []; window.testSentenceWords.push(word); }
        function clearTestSentence() { const builder = document.getElementById('testSentenceBuilder'); if (builder) { builder.innerHTML = ''; document.querySelectorAll('.word-bank span').forEach(el => { el.style.opacity = '1'; el.style.pointerEvents = 'auto'; }); window.testSentenceWords = []; } }
        function checkTestWordBank(qIndex) { const q = testQuestions[qIndex]; const builder = document.getElementById('testSentenceBuilder'); const words = Array.from(builder.querySelectorAll('span')).map(s => s.textContent); const sentence = words.join(' ').toLowerCase(); const isCorrect = sentence === q.correctSentence.toLowerCase(); if (!isCorrect) addError(currentLevel, q.question, q.correctSentence, sentence, q.lessonId); testAnswers.push({ question: q, userAnswer: sentence, correct: isCorrect }); if (isCorrect) score++; render(); }
        function handleTestFlashcard(qIndex) { testAnswers.push({ question: testQuestions[qIndex], userAnswer: 'Запомнил(а)', correct: true }); score++; render(); }

        function finishTest(level) { const maxScore = testQuestions.length; const grade = getGrade(score, maxScore); addTestScore(level, score, maxScore, testLessonIds); const gradeClass = `score-${grade}`; showModal(`<h2>📝 Контрольная завершена!</h2><p class="test-result ${gradeClass}">Оценка: ${grade}</p><p>Правильных ответов: ${score} из ${maxScore}</p>${grade >= 4 ? '<p>Отличная работа! Так держать! 🎉</p>' : '<p>Не расстраивайся, повтори материал и попробуй ещё раз!</p>'}<button class="btn" onclick="closeModal(); showScreen('level');">Вернуться к уровню</button>`); confetti(); isTestMode = false; }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        loadData();
        showScreen('login');
        document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        window.showScreen = showScreen;
        window.handleLogin = handleLogin;
        window.handleRegister = handleRegister;
        window.selectAvatar = selectAvatar;
        window.logout = logout;
        window.openLesson = openLesson;
        window.startLessonTasks = startLessonTasks;
        window.handleFlashcard = handleFlashcard;
        window.handleMultipleChoice = handleMultipleChoice;
        window.handleTranslation = handleTranslation;
        window.addWordToSentence = addWordToSentence;
        window.clearSentence = clearSentence;
        window.checkWordBank = checkWordBank;
        window.startTest = startTest;
        window.startOptionalTest = startOptionalTest;
        window.handleTestChoice = handleTestChoice;
        window.handleTestTranslation = handleTestTranslation;
        window.addTestWordToSentence = addTestWordToSentence;
        window.clearTestSentence = clearTestSentence;
        window.checkTestWordBank = checkTestWordBank;
        window.handleTestFlashcard = handleTestFlashcard;
        window.closeModal = closeModal;
        window.switchProfileTab = switchProfileTab;
    </script>
</body>
</html>
