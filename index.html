<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Businka English Club 💎</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');

:root{
  --bg:#eef7ff;
  --bg2:#dceeff;
  --card:rgba(255,255,255,.84);
  --blue:#3478c8;
  --blue2:#75aee8;
  --deep:#17395f;
  --text:#203957;
  --muted:#7890aa;
  --line:#cfe3f8;
  --pink:#f2b9d2;
  --success:#72b89c;
  --danger:#e9859e;
  --shadow:0 20px 60px rgba(45,94,145,.13);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:"DM Sans",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,rgba(130,193,255,.35),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(242,185,210,.28),transparent 25%),
    linear-gradient(135deg,var(--bg),#f7fbff);
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:270px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  padding:24px 18px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(22px);
  border-right:1px solid var(--line);
  z-index:20;
  overflow:auto;
}

.logo{
  font-family:"Playfair Display",serif;
  font-size:25px;
  color:var(--deep);
  margin:8px 12px 28px;
}

.logo span{color:var(--blue)}

.nav-title{
  font-size:11px;
  font-weight:800;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--muted);
  margin:20px 12px 9px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  padding:12px 14px;
  border-radius:14px;
  text-align:left;
  color:var(--text);
  font-weight:600;
  margin:2px 0;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:#dceeff;
  color:#2865aa;
  transform:translateX(3px);
}

.level-btn{
  display:flex!important;
  justify-content:space-between;
  align-items:center;
}

.level-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#8fbce7;
}

.main{
  margin-left:270px;
  width:calc(100% - 270px);
  padding:28px;
}

.topbar{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.mobile-menu{display:none}

.user-mini{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.75);
  border:1px solid var(--line);
  padding:8px 13px 8px 8px;
  border-radius:30px;
}

.avatar-small{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#e7f3ff;
  font-size:22px;
}

.content{
  max-width:1250px;
  margin:auto;
}

.hero{
  border-radius:32px;
  padding:38px;
  min-height:260px;
  background:
    linear-gradient(125deg,rgba(255,255,255,.96),rgba(224,241,255,.85)),
    radial-gradient(circle at 85% 30%,#c8e5ff,transparent 30%);
  border:1px solid white;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"✦";
  position:absolute;
  right:70px;
  top:25px;
  font-size:110px;
  color:#b7d8f7;
  transform:rotate(15deg);
}

.kicker{
  color:var(--blue);
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:800;
  font-size:12px;
}

h1,h2,h3{
  font-family:"Playfair Display",serif;
  color:var(--deep);
}

.hero h1{
  font-size:48px;
  max-width:700px;
  margin:10px 0;
}

.hero p{
  max-width:650px;
  line-height:1.7;
  color:#58728e;
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 20px;
  background:var(--blue);
  color:white;
  font-weight:700;
  box-shadow:0 8px 20px rgba(52,120,200,.2);
  transition:.2s;
}

.btn:hover{transform:translateY(-2px)}

.btn.secondary{
  background:white;
  color:var(--blue);
  border:1px solid var(--line);
  box-shadow:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:22px;
}

.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.95);
  border-radius:24px;
  padding:23px;
  box-shadow:var(--shadow);
}

.card h3{margin:4px 0 10px;font-size:21px}

.card p{
  color:#69829c;
  line-height:1.65;
}

.stat-number{
  font-family:"Playfair Display",serif;
  font-size:35px;
  color:var(--blue);
}

.progress{
  height:8px;
  background:#e1edf8;
  border-radius:99px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#5796d5,#9bc7f0);
  border-radius:99px;
  transition:.5s;
}

.level-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-top:22px;
}

.level-card{
  min-height:210px;
  position:relative;
  overflow:hidden;
}

.level-card .big{
  font-size:54px;
  font-family:"Playfair Display",serif;
  color:#4c8bca;
}

.lesson-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:20px;
}

.lesson{
  background:rgba(255,255,255,.85);
  border:1px solid var(--line);
  padding:20px;
  border-radius:20px;
  cursor:pointer;
  transition:.2s;
  position:relative;
}

.lesson:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}

.lesson-number{
  color:#8ca8c3;
  font-size:12px;
  font-weight:800;
}

.lesson h3{margin:7px 0;font-size:20px}

.lesson small{color:var(--muted)}

.lock{
  position:absolute;
  right:18px;
  top:18px;
}

.lesson-page{
  max-width:1050px;
  margin:auto;
}

.lesson-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:25px;
  margin-bottom:20px;
}

.lesson-head h1{
  font-size:42px;
  margin:5px 0;
}

.businka{
  width:160px;
  min-width:160px;
  text-align:center;
  padding:16px;
  border-radius:28px;
  background:rgba(255,255,255,.8);
  border:1px solid white;
  box-shadow:var(--shadow);
}

.businka .animal{
  font-size:75px;
  display:block;
  filter:drop-shadow(0 10px 10px rgba(45,94,145,.12));
}

.bubble{
  font-size:13px;
  line-height:1.45;
  color:#536d87;
}

.section{
  background:rgba(255,255,255,.86);
  border:1px solid white;
  border-radius:25px;
  padding:27px;
  margin:18px 0;
  box-shadow:var(--shadow);
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.section-title h2{margin:0;font-size:25px}

.theory{
  line-height:1.7;
  color:#4f6a85;
}

.rule-box{
  background:#edf7ff;
  border-left:4px solid var(--blue);
  padding:16px 18px;
  border-radius:12px;
  margin:14px 0;
}

.grammar-table{
  width:100%;
  border-collapse:collapse;
  margin:18px 0;
  overflow:hidden;
}

.grammar-table th{
  background:#dceeff;
  color:#285b91;
}

.grammar-table th,
.grammar-table td{
  padding:12px;
  border:1px solid #d5e7f7;
  text-align:left;
}

.example{
  padding:13px 15px;
  border-radius:13px;
  background:#f6faff;
  margin:8px 0;
}

.example strong{color:#2868aa}

.vocab-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.word{
  padding:13px;
  background:#f5faff;
  border:1px solid #dfedf9;
  border-radius:13px;
}

.word b{color:#2c68a5}

.task{
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  margin:14px 0;
  background:#fbfdff;
}

.task-number{
  color:#7293b0;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
}

.task h3{
  margin:7px 0 15px;
  font-size:20px;
}

.options{
  display:grid;
  gap:9px;
}

.option{
  border:1px solid #d7e7f5;
  background:white;
  padding:13px 15px;
  border-radius:13px;
  text-align:left;
  color:var(--text);
  transition:.15s;
}

.option:hover{
  border-color:#8bb9e5;
  background:#f4faff;
}

.option.correct{
  border-color:#72b89c;
  background:#eaf8f1;
}

.option.wrong{
  border-color:#e9859e;
  background:#fff0f4;
}

.answer-input,
.answer-area{
  width:100%;
  border:1px solid #cfe1f1;
  background:white;
  border-radius:13px;
  padding:13px 15px;
  outline:none;
}

.answer-area{min-height:100px;resize:vertical}

.answer-input:focus,
.answer-area:focus{border-color:#72a9dc}

.feedback{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  display:none;
  line-height:1.5;
}

.feedback.show{display:block}

.feedback.good{
  background:#eaf8f1;
  color:#37785d;
}

.feedback.bad{
  background:#fff0f4;
  color:#9d4962;
}

.reading{
  font-size:16px;
  line-height:1.9;
  background:#f7fbff;
  padding:22px;
  border-radius:17px;
}

.dialogue{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  max-width:80%;
  padding:13px 16px;
  border-radius:17px;
  line-height:1.5;
}

.msg.b{
  background:#e4f2ff;
  align-self:flex-start;
}

.msg.u{
  background:#f8e6ef;
  align-self:flex-end;
}

.lesson-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:25px 0 50px;
}

.auth{
  position:fixed;
  inset:0;
  z-index:100;
  background:
    radial-gradient(circle at 15% 20%,#b8dcff,transparent 30%),
    radial-gradient(circle at 90% 80%,#f3c8dd,transparent 30%),
    #eaf6ff;
  display:grid;
  place-items:center;
  padding:20px;
}

.auth-box{
  width:min(520px,100%);
  background:rgba(255,255,255,.9);
  border:1px solid white;
  border-radius:32px;
  padding:34px;
  box-shadow:0 30px 100px rgba(45,94,145,.2);
}

.auth-logo{
  text-align:center;
  font-size:80px;
}

.auth h1{
  text-align:center;
  font-size:35px;
  margin:5px 0 10px;
}

.auth p{
  text-align:center;
  color:#7189a2;
  line-height:1.6;
}

.field{
  margin:13px 0;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-weight:700;
  font-size:13px;
}

.field input,
.field select{
  width:100%;
  border:1px solid #cfe1f1;
  border-radius:13px;
  padding:13px;
  outline:none;
}

.avatars{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:7px;
  margin-top:8px;
}

.avatar-choice{
  padding:8px;
  border-radius:12px;
  border:1px solid #d7e7f5;
  background:#f7fbff;
  font-size:25px;
}

.avatar-choice.selected{
  background:#dceeff;
  border-color:#6099d0;
}

.auth-note{
  margin-top:12px;
  font-size:12px;
  color:#8da0b5;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#17395f;
  color:white;
  padding:14px 18px;
  border-radius:15px;
  box-shadow:var(--shadow);
  transform:translateY(120px);
  opacity:0;
  transition:.3s;
  z-index:200;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.badge-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.badge{
  padding:10px 13px;
  border-radius:14px;
  background:#edf7ff;
  border:1px solid var(--line);
}

.dictionary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.empty{
  padding:40px;
  text-align:center;
  color:#8499ae;
}

@media(max-width:950px){
  .sidebar{width:220px}
  .main{margin-left:220px;width:calc(100% - 220px)}
  .level-grid{grid-template-columns:repeat(2,1fr)}
  .lesson-list{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:700px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
    width:270px;
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%;padding:15px}
  .mobile-menu{
    display:block;
    border:0;
    background:white;
    border-radius:12px;
    padding:10px 13px;
  }
  .topbar{margin-bottom:15px}
  .hero{padding:25px}
  .hero h1{font-size:35px}
  .grid,.lesson-list,.level-grid,.dictionary{grid-template-columns:1fr}
  .lesson-head{flex-direction:column}
  .businka{width:100%;display:flex;align-items:center;gap:15px}
  .businka .animal{font-size:55px}
  .vocab-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="auth" class="auth">
  <div class="auth-box">
    <div class="auth-logo">🐇</div>
    <h1>Businka English Club</h1>
    <p>English, but make it actually understandable.</p>

    <div class="field">
      <label>Nickname</label>
      <input id="nickname" placeholder="Например, nastya">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="Минимум 4 символа">
    </div>

    <div class="field">
      <label>Возраст</label>
      <select id="age">
        <option value="">Выберите возраст</option>
      </select>
    </div>

    <div class="field">
      <label>Выбери аватарку</label>
      <div id="avatars" class="avatars"></div>
    </div>

    <button class="btn" style="width:100%;margin-top:12px" onclick="register()">Войти в клуб</button>
    <div class="auth-note">Данные сохраняются локально в браузере через localStorage.</div>
  </div>
</div>

<div id="app" class="app hidden">

<aside class="sidebar" id="sidebar">
  <div class="logo">Businka <span>English</span></div>

  <div class="nav">
    <div class="nav-title">Navigation</div>
    <button onclick="showHome()">🏠 Главная</button>
    <button onclick="showPlacement()">🧠 Тест уровня</button>
    <button onclick="showProfile()">👤 Профиль</button>
    <button onclick="showDictionary()">📖 Словарик</button>

    <div class="nav-title">Levels</div>
    <button class="level-btn" onclick="showLevel('A1')">A1 Beginner <span class="level-dot"></span></button>
    <button class="level-btn" onclick="showLevel('A2')">A2 Elementary <span class="level-dot"></span></button>
    <button class="level-btn" onclick="showLevel('B1')">B1 Intermediate <span class="level-dot"></span></button>
    <button class="level-btn" onclick="showLevel('B2')">B2 Upper-Intermediate <span class="level-dot"></span></button>

    <div class="nav-title">Account</div>
    <button onclick="logout()">↪ Выйти</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
    <div></div>
    <div class="user-mini">
      <div id="miniAvatar" class="avatar-small">🐇</div>
      <span id="miniName">Student</span>
    </div>
  </div>

  <div id="content" class="content"></div>
</main>

</div>

<div id="toast" class="toast"></div>

========================================================= */

let user = JSON.parse(localStorage.getItem("businkaUser") || "null");

function saveUser(){
  localStorage.setItem("businkaUser",JSON.stringify(user));

function theoryFor(level,index){

  let g=grammar[level];

  if(index===0) return g;

  const lesson=LEVELS[level].lessons[index];

  return {
    title:lesson[1],
    explain:
      `В этом уроке мы разбираем тему «${lesson[0]}». `+
      `Сначала поймём правило, затем увидим его в живых примерах и только после этого перейдём к практике.`,
    table:[
      ["Affirmative","subject + structure","I / You / She + ..."],
      ["Negative","subject + negative form","I don't / She doesn't / ..."],
      ["Question","auxiliary + subject + ...","Do you...? / Does she...?"]
    ],
    rules:[
      `Сначала определи, что именно выражает предложение.`,
      `Следи за subject: I, you, he, she, it, we, they.`,
      `Не переводи английскую конструкцию слово в слово, если структура отличается от русского.`,
      `Используй лексику урока в собственных примерах.`
    ],
    examples:[
      [`I use this expression in real conversations.`,`Я использую это выражение в реальных разговорах.`],
      [`She usually asks a follow-up question.`,`Она обычно задаёт уточняющий вопрос.`],
      [`Do you understand the difference?`,`Ты понимаешь разницу?`]
    ]
  };
}

  return String(str).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

            🐱 <b>Бусинка:</b> Hi! I don't want a boring textbook answer.

          <div class="msg u">
            You: Hi! My name is Alex. I'm from London.

        <button class="btn" onclick="finishLesson()">Finish lesson</button>

}

function answerChoice(taskIndex,choice,correct){

  if(taskResults[taskIndex]) return;

  const buttons=document.querySelectorAll(`#task-${taskIndex} .option`);
  const feedback=document.getElementById(`feedback-${taskIndex}`);

  taskResults[taskIndex]=choice===correct;

  buttons.forEach((b,i)=>{
    if(i===correct)b.classList.add("correct");
    if(i===choice && i!==correct)b.classList.add("wrong");
    b.disabled=true;
  });

  if(choice===correct){
    feedback.className="feedback show good";
    feedback.textContent=goodPhrases[Math.floor(Math.random()*goodPhrases.length)];
    businkaMood("happy");
  }else{
    feedback.className="feedback show bad";
    feedback.textContent=badPhrases[Math.floor(Math.random()*badPhrases.length)];
    businkaMood("angry");
  }
}

function normalize(s){
  return String(s)
    .toLowerCase()
    .trim()
    .replace(/[.!?,]/g,"")
    .replace(/\s+/g," ");
}

function answerInput(taskIndex,correct){

  if(taskResults[taskIndex])return;

  const input=document.getElementById(`input-${taskIndex}`);
  const feedback=document.getElementById(`feedback-${taskIndex}`);

  if(!input.value.trim()){
    toast("Напиши ответ, genius. Пустое поле не считается.");
    return;
  }

  if(correct==="open"){
    taskResults[taskIndex]=true;
    feedback.className="feedback show good";
    feedback.textContent="Ответ принят. Writing practice completed. ✦";
    input.disabled=true;
    businkaMood("happy");
    return;
  }

  const ok=normalize(input.value)===normalize(correct);
  taskResults[taskIndex]=ok;

  feedback.className="feedback show "+(ok?"good":"bad");

  if(ok){
    feedback.textContent=goodPhrases[Math.floor(Math.random()*goodPhrases.length)];
    businkaMood("happy");
    input.disabled=true;
  }else{
    feedback.textContent=badPhrases[Math.floor(Math.random()*badPhrases.length)];
    businkaMood("angry");
  }
}

function businkaMood(mood){
  const b=document.getElementById("businkaBubble");
  if(!b)return;

  if(mood==="happy"){
    b.textContent=goodPhrases[Math.floor(Math.random()*goodPhrases.length)];
  }else{
    b.textContent=badPhrases[Math.floor(Math.random()*badPhrases.length)];
  }
}

/* =========================================================
   LESSON COMPLETION
========================================================= */

function finishLesson(){

  const total=Object.keys(taskResults).length;
  const correct=Object.values(taskResults).filter(Boolean).length;

  if(total<10){
    toast("Сначала выполни задания.");
    return;
  }

  const percent=Math.round(correct/total*100);
  const key=currentLesson.level+"-"+currentLesson.index;

  if(percent<25){
    user.lessons[key]={
      completed:false,
      score:percent
    };

    saveUser();

    toast("Меньше 25%. Урок нужно пройти ещё раз.");
    return;
  }

  const perfect=percent===100;

  user.lessons[key]={
    completed:true,
    score:percent,
    perfect
  };

  if(perfect && !user.achievements.includes(key)){
    user.achievements.push(key);
  }

  addVocabulary(currentLesson.level,currentLesson.index);
  saveUser();

  render(`
    <div class="lesson-page">
      <div class="hero">
        <div class="kicker">LESSON COMPLETE</div>
        <h1>${perfect?"Без ошибок. Серьёзно? 💎":"Урок завершён."}</h1>
        <p>
          Твой результат: <b>${percent}%</b>.
          ${perfect
            ?"Бусинка официально впечатлена."
            :"Главное, что порог пройден. Следующий урок ждёт."
          }
        </p>
        <button class="btn" onclick="showLevel('${currentLesson.level}')">
          Вернуться к урокам
        </button>
      </div>
    </div>
  `);
}

function addVocabulary(level,index){

  getVocabulary(level,index).forEach(w=>{
    if(!user.dictionary.some(x=>x.word===w[0])){
      user.dictionary.push({
        word:w[0],
        translation:w[1],
        level
      });
    }
  });
}

/* =========================================================
   CONTROL TESTS
========================================================= */

function startTest(level,index){

  const testNumber=index===3?1:index===7?2:index===11?3:4;

  const previousStart=(testNumber-1)*4;
  const covered=LEVELS[level].lessons
    .slice(previousStart,index)
    .map(x=>x[0]);

  const questions=[];

  for(let i=0;i<20;i++){
    const lessonName=covered[i%covered.length];

    questions.push({
      q:`Which sentence is the most grammatically appropriate in the context of "${lessonName}"?`,
      options:[
        "I am learning English because I want to communicate more confidently.",
        "I learning English because I am want communicate.",
        "I am learn English because I want communicating.",
        "I learning English because I want to communicated."
      ],
      answer:0
    });
  }

  render(`
    <div class="lesson-page">

      <div class="lesson-head">
        <div>
          <div class="kicker">${level} · CONTROL TEST ${testNumber}</div>
          <h1>Progress Check</h1>
          <p style="color:#7189a2">
            20 questions · topics:
            ${covered.join(" · ")}
          </p>
        </div>

        <div class="businka">
          <span class="animal">🐱🎀</span>
          <div class="bubble">
            Я всё вижу. И да, здесь 20 заданий.
          </div>
        </div>
      </div>

      <div class="section">
        ${questions.map((q,i)=>`
          <div class="task" id="test-task-${i}">
            <div class="task-number">Question ${i+1}/20</div>
            <h3>${q.q}</h3>

            <div class="options">
              ${q.options.map((o,j)=>`
                <button class="option"
                  onclick="testAnswer(${i},${j},${q.answer})">${o}</button>
              `).join("")}
            </div>

            <div id="test-feedback-${i}" class="feedback"></div>
          </div>
        `).join("")}
      </div>

      <div class="lesson-footer">
        <button class="btn secondary" onclick="showLevel('${level}')">← Back</button>
        <button class="btn" onclick="finishTest('${level}',${index})">Finish test</button>
      </div>

    </div>
  `);

  window.currentTestResults={};
}

function testAnswer(i,choice,correct){

  if(window.currentTestResults[i]!==undefined)return;

  window.currentTestResults[i]=choice===correct;

  const buttons=document.querySelectorAll(`#test-task-${i} .option`);
  const feedback=document.getElementById(`test-feedback-${i}`);

  buttons.forEach((b,j)=>{
    if(j===correct)b.classList.add("correct");
    if(j===choice && j!==correct)b.classList.add("wrong");
    b.disabled=true;
  });

  if(choice===correct){
    feedback.className="feedback show good";
    feedback.textContent=goodPhrases[Math.floor(Math.random()*goodPhrases.length)];
  }else{
    feedback.className="feedback show bad";
    feedback.textContent=badPhrases[Math.floor(Math.random()*badPhrases.length)];
  }
}

function finishTest(level,index){

  const results=window.currentTestResults||{};
  const answered=Object.keys(results).length;

  if(answered<20){
    toast("Все 20 вопросов должны быть выполнены.");
    return;
  }

  const correct=Object.values(results).filter(Boolean).length;
  const grade=Math.round(correct/20*5);
  const passed=grade>=3;

  user.tests[level+"-"+index]={
    score:correct,
    grade,
    passed
  };

  saveUser();

  render(`
    <div class="lesson-page">
      <div class="hero">
        <div class="kicker">CONTROL TEST RESULT</div>
        <h1>${passed?"Test passed.":"Needs another round."}</h1>
        <p>
          Результат: ${correct}/20 · школьная оценка: <b>${grade}/5</b>.
        </p>
        <p>
          ${passed
            ?"Следующие темы открыты. Keep going."
            :"Оценка ниже 3. Повтори предыдущие темы и попробуй контрольную снова."
          }
        </p>
        <button class="btn" onclick="showLevel('${level}')">Вернуться</button>
      </div>
    </div>
  `);
}

/* =========================================================
   PLACEMENT TEST
========================================================= */

function showPlacement(){

  const questions=[
    {
      q:"Choose: “My name ___ Anna.”",
      o:["am","is","are","be"],
      a:1
    },
    {
      q:"Choose: “I ___ coffee every morning.”",
      o:["drink","drinks","drinking","drank"],
      a:0
    },
    {
      q:"Choose: “She ___ to London last year.”",
      o:["has gone","went","goes","is going"],
      a:1
    },
    {
      q:"Choose: “I have never ___ sushi.”",
      o:["eat","ate","eaten","eating"],
      a:2
    },
    {
      q:"Choose: “If I had more time, I ___ another language.”",
      o:["learn","will learn","would learn","learned"],
      a:2
    },
    {
      q:"Choose the most natural sentence.",
      o:[
        "It seems that the results may be inaccurate.",
        "It seem results may inaccurate.",
        "It seems results can inaccurate.",
        "It seeming that results are inaccurate."
      ],
      a:0
    }
  ];

  render(`
    <div class="lesson-page">

      <div class="hero">
        <div class="kicker">PLACEMENT TEST</div>
        <h1>Let's see where you actually are.</h1>
        <p>
          Тест не пытается тебя поймать на случайном слове.
          Он проверяет грамматические конструкции от A1 до B2.
        </p>
      </div>

      <div class="section">
        ${questions.map((q,i)=>`
          <div class="task" id="placement-${i}">
            <div class="task-number">Question ${i+1}</div>
            <h3>${q.q}</h3>
            <div class="options">
              ${q.o.map((x,j)=>`
                <button class="option"
                  onclick="placementAnswer(${i},${j},${q.a})">${x}</button>
              `).join("")}
            </div>
          </div>
        `).join("")}

        <button class="btn" onclick="finishPlacement()">Calculate level</button>
      </div>

    </div>
  `);

  window.placementResults={};
}

function placementAnswer(i,j,a){

  if(window.placementResults[i]!==undefined)return;

  window.placementResults[i]=j===a;

  document.querySelectorAll(`#placement-${i} .option`).forEach((b,k)=>{
    if(k===a)b.classList.add("correct");
    if(k===j && k!==a)b.classList.add("wrong");
    b.disabled=true;
  });
}

function finishPlacement(){

  const r=window.placementResults||{};
  const score=Object.values(r).filter(Boolean).length;

  let level="A1";

  if(score>=5)level="B2";
  else if(score>=4)level="B1";
  else if(score>=2)level="A2";

  user.level=level;
  user.placementDone=true;
  saveUser();

  render(`
    <div class="lesson-page">

      <div class="hero">
        <div class="kicker">YOUR RESULT</div>
        <h1>${level}</h1>
        <p>
          Ты набрала ${score}/${Object.keys(r).length}.
          Стартовый уровень: <b>${level}</b>.
        </p>

        <button class="btn" onclick="showLevel('${level}')">
          Начать обучение →
        </button>
      </div>

    </div>
  `);
}

/* =========================================================
   UTILS
========================================================= */

function toast(text){

  const el=document.getElementById("toast");

  el.textContent=text;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2800);
}

</script>
